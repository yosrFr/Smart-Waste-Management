<lib-page-header
  [title]="'Dashboard'"
  [subtitle]="'Vue d\'ensemble de l\'activité'"
>
</lib-page-header>

<!-- Cartes de statistiques -->
<div class="stats-grid">
  <!-- Points de collecte -->
  <lib-stat-card
    [value]="totalPoints"
    [label]="'Points de collecte'"
    [icon]="'location_on'"
  ></lib-stat-card>

  <lib-stat-card
    [value]="pointsPleins"
    [label]="'Points pleins'"
    [subtitle]="'Nécessitent une collecte'"
    [icon]="'delete'"
  ></lib-stat-card>

  <lib-stat-card
    [value]="pointsEndommages"
    [label]="'Points endommagés'"
    [subtitle]="'Nécessitent réparation'"
    [icon]="'warning'"
  ></lib-stat-card>

  <!-- Véhicules -->
  <lib-stat-card
    [value]="vehiculesDisponibles"
    [label]="'Véhicules disponibles'"
    [icon]="'local_shipping'"
  ></lib-stat-card>

  <lib-stat-card
    [value]="vehiculesEnReparation"
    [label]="'Véhicules en réparation'"
    [icon]="'build_circle'"
  ></lib-stat-card>

  <lib-stat-card
    [value]="vehiculesEnMission"
    [label]="'Véhicules en mission'"
    [icon]="'route'"
  ></lib-stat-card>

  <!-- Tournées -->
  <lib-stat-card
    [value]="tourneesEnCours"
    [label]="'Tournées en cours'"
    [subtitle]="'Aujourd\'hui'"
    [icon]="'directions'"
  ></lib-stat-card>

  <lib-stat-card
    [value]="tourneesTerminees"
    [label]="'Tournées terminées'"
    [subtitle]="'Aujourd\'hui'"
    [icon]="'check_circle'"
  ></lib-stat-card>

  <lib-stat-card
    [value]="tourneesNonCommencees"
    [label]="'Tournées non commencées'"
    [subtitle]="'Aujourd\'hui'"
    [icon]="'schedule'"
  ></lib-stat-card>
</div>

<!-- Tournées du jour -->
<mat-card class="tournees-card">
  <mat-card-header>
    <mat-card-title>
      <div class="card-title-row">
        <div class="card-title-left">
          <mat-icon>today</mat-icon>
          <span>Tournées du jour</span>
        </div>
        <button mat-raised-button color="primary" (click)="goToTournees()">
          Voir toutes les tournées
        </button>
      </div>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="table-container">
      <table mat-table [dataSource]="tourneesAujourdhui" class="tournees-table">
        <!-- Véhicule -->
        <ng-container matColumnDef="vehicule">
          <th mat-header-cell *matHeaderCellDef>Véhicule</th>
          <td mat-cell *matCellDef="let tournee">
            {{ tournee.vehicule.matricule }}
          </td>
        </ng-container>

        <!-- Type de déchet -->
        <ng-container matColumnDef="typeDechet">
          <th mat-header-cell *matHeaderCellDef>Type de déchet</th>
          <td mat-cell *matCellDef="let tournee">
            {{ tournee.vehicule.typeDechet | enumLabel : 'TypeDechet' }}
          </td>
        </ng-container>

        <!-- Statut -->
        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let tournee">
            <lib-status-badge
              [label]="tournee.statut | enumLabel : 'StatutTournee'"
              [color]="getStatutColor(tournee.statut)"
            ></lib-status-badge>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let tournee">
            <button
              mat-icon-button
              color="primary"
              (click)="viewTourneeMap(tournee); $event.stopPropagation()"
              matTooltip="Voir sur la carte"
            >
              <mat-icon>map</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <div *ngIf="tourneesAujourdhui.length === 0" class="no-data">
        <mat-icon>event_busy</mat-icon>
        <p>Aucune tournée prévue pour aujourd'hui</p>
      </div>
    </div>
  </mat-card-content>
</mat-card>
