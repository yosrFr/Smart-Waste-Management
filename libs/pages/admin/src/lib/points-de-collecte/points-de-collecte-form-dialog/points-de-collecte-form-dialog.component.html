<h2 mat-dialog-title>
  {{ isEditMode ? 'Modifier' : 'Ajouter' }} un point de collecte
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form">
    <!-- Localisation -->
    <div class="form-section">
      <h3>Localisation</h3>
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Latitude</mat-label>
          <input
            matInput
            type="number"
            formControlName="latitude"
            step="0.0001"
          />
          <mat-error *ngIf="form.get('latitude')?.hasError('required')">
            La latitude est requise
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Longitude</mat-label>
          <input
            matInput
            type="number"
            formControlName="longitude"
            step="0.0001"
          />
          <mat-error *ngIf="form.get('longitude')?.hasError('required')">
            La longitude est requise
          </mat-error>
        </mat-form-field>
      </div>

      <button
        mat-stroked-button
        type="button"
        (click)="chooseOnMap()"
        class="map-button"
      >
        <mat-icon>map</mat-icon>
        Choisir sur la carte
      </button>
    </div>

    <!-- Type de déchet -->
    <div class="form-section">
      <h3>Type de déchet</h3>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Type de déchet</mat-label>
        <mat-select formControlName="typeDechet">
          <mat-option [value]="TypeDechet.PLASTIQUE">Plastique</mat-option>
          <mat-option [value]="TypeDechet.METAUX">Métaux</mat-option>
          <mat-option [value]="TypeDechet.ALIMENTAIRE">Alimentaire</mat-option>
          <mat-option [value]="TypeDechet.VERRE">Verre</mat-option>
          <mat-option [value]="TypeDechet.AUTRE">Autre</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('typeDechet')?.hasError('required')">
          Le type de déchet est requis
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Capacité -->
    <div *ngIf="!isEditMode" class="form-section">
      <h3>Capacité</h3>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Capacité</mat-label>
        <input matInput type="number" formControlName="capacite" step="1" />
        <mat-error *ngIf="form.get('longitude')?.hasError('required')">
          La capacité est requise
        </mat-error>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button
    mat-raised-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="form.invalid"
  >
    {{ isEditMode ? 'Modifier' : 'Ajouter' }}
  </button>
</mat-dialog-actions>
