<lib-page-header
  [title]="'Points de collecte'"
  [subtitle]="totalPoints + ' points au total'"
>
  <!-- Boutons Vue -->
  <mat-button-toggle-group
    [value]="viewMode"
    (change)="viewMode = $event.value"
  >
    <mat-button-toggle value="table">
      <mat-icon>table_chart</mat-icon>
      Tableau
    </mat-button-toggle>
    <mat-button-toggle value="map">
      <mat-icon>map</mat-icon>
      Carte
    </mat-button-toggle>
  </mat-button-toggle-group>

  <!-- Bouton Ajouter -->
  <button mat-raised-button color="primary" (click)="addPoint()">
    <mat-icon>add</mat-icon>
    Ajouter un point
  </button>
</lib-page-header>

<!-- Loading -->
<lib-loading-spinner
  *ngIf="loading$ | async"
  [message]="'Chargement des points de collecte...'"
></lib-loading-spinner>

<!-- Vue Tableau -->
<div *ngIf="viewMode === 'table' && (loading$ | async) === false">
  <lib-data-table
    [data]="points"
    [columns]="tableColumns"
    [actions]="tableActions"
    [paginated]="true"
    [searchable]="true"
    [pageSize]="10"
  ></lib-data-table>
</div>

<!-- Vue Carte -->
<div
  *ngIf="viewMode === 'map' && (loading$ | async) === false"
  class="map-container"
>
  <lib-leaflet-map
    [height]="600"
    [markers]="mapMarkers"
    [center]="mapCenter"
    [zoom]="12"
    (markerClick)="onMarkerClick($event)"
  ></lib-leaflet-map>

  <!-- Légende -->
  <div class="map-legend">
    <h4>Légende</h4>
    <div class="legend-items">
      <div class="legend-item">
        <div class="legend-color" style="background-color: #2e7d32"></div>
        <span>Normal</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #c62828"></div>
        <span>Plein</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #9e9e9e"></div>
        <span>Endommagé</span>
      </div>
    </div>
  </div>
</div>
