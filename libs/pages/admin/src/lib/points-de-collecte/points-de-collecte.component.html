<lib-page-header
  [title]="'Points de collecte'"
  [subtitle]="totalPoints + ' points au total'"
>
  <!-- Boutons Vue -->
  <mat-button-toggle-group
    [value]="viewMode"
    (change)="viewMode = $event.value"
  >
    <mat-button-toggle value="table">
      <mat-icon>table_chart</mat-icon>
      Tableau
    </mat-button-toggle>
    <mat-button-toggle value="map">
      <mat-icon>map</mat-icon>
      Carte
    </mat-button-toggle>
  </mat-button-toggle-group>

  <!-- Bouton Ajouter -->
  <button mat-raised-button color="primary" (click)="addPoint()">
    <mat-icon>add</mat-icon>
    Ajouter un point
  </button>
</lib-page-header>

<!-- Loading -->
<lib-loading-spinner
  *ngIf="loading$ | async"
  [message]="'Chargement des points de collecte...'"
></lib-loading-spinner>

<!-- Vue Tableau -->
<lib-points-collecte-table
  *ngIf="viewMode === 'table'"
  [points]="points"
  [tableColumns]="tableColumns"
  [tableActions]="tableActions"
  [loading$]="loading$"
>
</lib-points-collecte-table>

<!-- Vue Carte -->
<lib-points-collecte-map
  *ngIf="viewMode === 'map'"
  [points]="points"
  [center]="mapCenter"
  [loading$]="loading$"
  (markerClick)="onMarkerClick($event)"
>
</lib-points-collecte-map>
