<lib-page-header
  [title]="'Employés'"
  [subtitle]="totalEmployes + ' employés au total'"
>
  <button mat-raised-button color="primary" (click)="addEmploye()">
    <mat-icon>add</mat-icon>
    Ajouter un employé
  </button>
</lib-page-header>

<!-- Loading -->
<lib-loading-spinner
  *ngIf="loading$ | async"
  [message]="'Chargement des employés...'"
></lib-loading-spinner>

<!-- Tabs par disponibilité -->
<div *ngIf="(loading$ | async) === false">
  <lib-tabs [tabs]="tabs" [selectedIndex]="selectedTabIndex">
    <!-- Disponibles -->
    <div tab="DISPONIBLE">
      <lib-data-table
        [data]="employesDisponibles"
        [columns]="tableColumns"
        [actions]="tableActions"
        [paginated]="true"
        [searchable]="true"
        [pageSize]="10"
      ></lib-data-table>
    </div>

    <!-- En mission -->
    <div tab="EN_MISSION">
      <lib-data-table
        [data]="employesEnMission"
        [columns]="tableColumns"
        [actions]="tableActions"
        [paginated]="true"
        [searchable]="true"
        [pageSize]="10"
      ></lib-data-table>
    </div>

    <!-- Admin -->
    <div tab="ADMIN">
      <lib-data-table
        [data]="admin"
        [columns]="tableColumns"
        [actions]="tableActions"
        [paginated]="true"
        [searchable]="true"
        [pageSize]="10"
      ></lib-data-table>
    </div>

    <!-- Inactifs -->
    <div tab="INACTIF">
      <lib-data-table
        [data]="employesInactifs"
        [columns]="tableColumns"
        [actions]="tableActions"
        [paginated]="true"
        [searchable]="true"
        [pageSize]="10"
      ></lib-data-table>
    </div>
  </lib-tabs>
</div>
