<mat-toolbar class="app-header" color="primary">
  <!-- Bouton toggle sidebar -->
  <button mat-icon-button (click)="toggleSidebar.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Titre de la page -->
  <span class="page-title">{{ pageTitle }}</span>

  <span class="spacer"></span>

  <!-- Bouton Notifications -->
  <button
    #notificationTrigger="matMenuTrigger"
    mat-icon-button
    [matMenuTriggerFor]="notificationMenu"
    class="notification-button"
    (menuOpened)="onMenuOpened('notification')"
  >
    <mat-icon matBadgeColor="warn" matBadgeSize="small">
      notifications
    </mat-icon>
  </button>

  <!-- Menu Notifications -->
  <mat-menu #notificationMenu="matMenu" class="notification-menu">
    <div class="notification-header">
      <h3>Notifications récentes</h3>
    </div>
    <mat-divider></mat-divider>

    <div class="notification-list">
      <button
        mat-menu-item
        *ngFor="let notif of recentNotifications$ | async"
        (click)="goToNotifications()"
        class="notification-item"
      >
        <mat-icon class="notification-icon">
          {{ getNotificationIcon(notif.type) }}
        </mat-icon>
        <div class="notification-content">
          <p class="notification-title">{{ notif.description }}</p>
          <span class="notification-time">
            {{ notif.date | dateRelative }}
          </span>
        </div>
      </button>
      <!-- Dans le cas où il n'y a pas de notification -->
      <div
        *ngIf="(recentNotifications$ | async)?.length === 0"
        class="no-notifications"
      >
        <mat-icon>notifications_none</mat-icon>
        <p>Aucune notification</p>
      </div>
    </div>

    <!-- Pour ce déplacer à la page de notifications -->
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="goToNotifications()">
      <mat-icon>list</mat-icon>
      <span>Voir toutes les notifications</span>
    </button>
  </mat-menu>

  <!-- Bouton Thème -->
  <button
    #themeTrigger="matMenuTrigger"
    mat-icon-button
    [matMenuTriggerFor]="themeMenu"
    (menuOpened)="onMenuOpened('theme')"
  >
    <mat-icon>
      {{
        currentTheme === 'light'
          ? 'light_mode'
          : currentTheme === 'dark'
          ? 'dark_mode'
          : 'brightness_auto'
      }}
    </mat-icon>
  </button>

  <!-- Menu Thème -->
  <mat-menu #themeMenu="matMenu">
    <button mat-menu-item (click)="setTheme('light')">
      <mat-icon>light_mode</mat-icon>
      <span>Clair</span>
    </button>
    <button mat-menu-item (click)="setTheme('dark')">
      <mat-icon>dark_mode</mat-icon>
      <span>Sombre</span>
    </button>
    <button mat-menu-item (click)="setTheme('auto')">
      <mat-icon>brightness_auto</mat-icon>
      <span>Système</span>
    </button>
  </mat-menu>

  <!-- Menu Utilisateur -->
  <button
    #userTrigger="matMenuTrigger"
    mat-icon-button
    [matMenuTriggerFor]="userMenu"
    (menuOpened)="onMenuOpened('user')"
  >
    <mat-icon>account_circle</mat-icon>
  </button>

  <!-- Menu déroulant Utilisateur -->
  <mat-menu #userMenu="matMenu">
    <!-- Informations sur l'utilisateur -->
    <ng-container *ngIf="currentUser$ | async as user">
      <div class="user-info">
        <p class="user-name">
          {{ user.prenom }}
          {{ user.nom }}
        </p>
        <p class="user-role">
          {{ user.role | enumLabel : 'Role' }}
        </p>
      </div>
    </ng-container>
    <mat-divider></mat-divider>
    <!-- Bouton pour ce déplacer à la page du profil -->
    <button mat-menu-item (click)="goToProfile()">
      <mat-icon>person</mat-icon>
      <span>Voir profil</span>
    </button>
    <!-- Bouton pour ce déplacer à la page de changement de mot de passe-->
    <button mat-menu-item (click)="goToChangePassword()">
      <mat-icon>lock</mat-icon>
      <span>Changer mot de passe</span>
    </button>
    <mat-divider></mat-divider>
    <!-- Bouton de Logout -->
    <button mat-menu-item (click)="onLogout()">
      <mat-icon color="warn">logout</mat-icon>
      <span>Déconnexion</span>
    </button>
  </mat-menu>
</mat-toolbar>
