<!-- Header (fixed, outside drawer) -->
<lib-header (toggleSidebar)="drawer.toggle()" class="fixed-header"></lib-header>

<mat-drawer-container class="layout-container" autosize>
  <!-- Sidebar -->
  <mat-drawer #drawer class="layout-sidenav">
    <lib-sidebar></lib-sidebar>
  </mat-drawer>

  <!-- Contenu principal -->
  <mat-drawer-content class="layout-content">
    <!-- Contenu des pages -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
