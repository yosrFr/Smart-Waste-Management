<!-- Header -->
<lib-header (toggleSidebar)="drawer.toggle()" class="fixed-header"></lib-header>

<!-- Drawer container sous le header -->
<mat-drawer-container class="drawer-and-content" autosize [hasBackdrop]="false">
  <!-- Sidebar -->
  <mat-drawer #drawer class="layout-sidenav" mode="side" [opened]="true">
    <lib-sidebar></lib-sidebar>
  </mat-drawer>

  <!-- Contenu principal -->
  <mat-drawer-content class="layout-content">
    <!-- Contenu des pages -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
