<h2>Choisir une localisation</h2>
<!-- Map -->
<lib-leaflet-map
  [height]="500"
  [selectionMode]="true"
  (positionSelected)="onPosSelected($event)"
></lib-leaflet-map>

<!-- Les boutons des actions -->
<div class="actions">
  <button mat-stroked-button (click)="cancel()">Annuler</button>
  <button mat-flat-button color="primary" (click)="validate()">Valider</button>
</div>
